# RootSpeak tests at every push and pull request, with what runs on a GitHub
# machine: build (warnings as errors), unit tests, manual checks and
# tests/engine.sh in test mode (without root).
# The real-world tests (tests/container/run.sh, tests/vm/run.sh) and the fuzzing
# stay on the PC and on the test server: they need podman with systemd or a VM
# with a desktop.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc make pkg-config libsystemd-dev python3-pygments

      - name: Build (make)
        run: make

      - name: Unit tests (make unit)
        run: make unit

      # before tests/engine.sh, which rewrites tests/results/engine.json
      - name: Manual checks (make docs-check)
        run: make docs-check

      - name: Engine in test mode (tests/engine.sh)
        run: tests/engine.sh
