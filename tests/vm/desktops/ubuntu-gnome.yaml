#cloud-config
# RootSpeak - Advanced Messaging System for Linux
# Test VM with a desktop: Ubuntu 24.04 LTS, GNOME (Ubuntu's session) on Wayland,
# automatic login of «sara».
# desktop: GNOME (Ubuntu session)
# image: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
# prepare.sh replaces @KEYS@ (root's ssh keys) and @COMMON@ (users.sh, run at the end).
hostname: rootspeak-desktop
disable_root: false
ssh_pwauth: false
users:
  - name: root
    ssh_authorized_keys: [@KEYS@]
package_update: true
packages: [ubuntu-desktop-minimal, zenity, python3-pyatspi, at-spi2-core, openssh-server, sudo, python3,
           procps, locales,
           # to build RootSpeak in the VM, as a customer does
           gcc, make, pkg-config, libsystemd-dev, libc6-dev]
write_files:
  @COMMON@
  - path: /etc/gdm3/custom.conf
    content: |
      [daemon]
      AutomaticLoginEnable=true
      AutomaticLogin=sara
  - path: /etc/dconf/profile/user
    content: |
      user-db:user
      system-db:local
  - path: /etc/dconf/db/local.d/00-rootspeak-test
    content: |
      [org/gnome/desktop/session]
      idle-delay=uint32 0
      [org/gnome/desktop/screensaver]
      lock-enabled=false
      [org/gnome/desktop/interface]
      toolkit-accessibility=true
      [org/gnome/shell]
      welcome-dialog-last-shown-version='999'
runcmd:
  - dconf update
  - /usr/local/sbin/rootspeak-test-users
power_state:
  mode: poweroff
  condition: true
